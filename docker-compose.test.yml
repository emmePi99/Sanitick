services:
  db_test:
    container_name: postgres_test
    image: postgres
    environment:
      POSTGRES_USER: postgres_test
      POSTGRES_PASSWORD: password_test
      POSTGRES_DB: sanitick_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d sanitick_test -U postgres_test"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  default:
    name: sanitick_test_net
