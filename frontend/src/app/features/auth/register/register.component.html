<div class="register-container">
  @if (!registrationSuccess()) {
    <mat-card class="register-card">
      <mat-card-header>
        <mat-card-title>Registrazione Paziente</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <div *ngIf="errorMessage()" class="error-message">{{ errorMessage() }}</div>
        <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="register-form">
          <div class="form-row">
            <mat-form-field appearance="outline">
              <mat-label>Nome</mat-label>
              <input matInput formControlName="firstName" />
            </mat-form-field>
            <mat-form-field appearance="outline">
              <mat-label>Cognome</mat-label>
              <input matInput formControlName="lastName" />
            </mat-form-field>
          </div>
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Email</mat-label>
            <input matInput formControlName="email" type="email" />
            <mat-error *ngIf="registerForm.get('email')?.hasError('email')"
              >Email non valida</mat-error
            >
          </mat-form-field>
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Codice Fiscale</mat-label>
            <input matInput formControlName="fiscalCode" />
            <mat-error *ngIf="registerForm.get('fiscalCode')?.hasError('pattern')"
              >Codice Fiscale non valido</mat-error
            >
          </mat-form-field>
          <button
            mat-raised-button
            color="primary"
            type="submit"
            [disabled]="registerForm.invalid || isLoading()"
            class="full-width"
          >
            {{ isLoading() ? 'Registrazione in corso...' : 'Registrati' }}
          </button>
          <div class="login-link">
            <span>Hai già un account?</span>
            <a routerLink="/login">Accedi qui</a>
          </div>
        </form>
      </mat-card-content>
    </mat-card>
  } @else {
    <mat-card class="register-card">
      <mat-card-content class="success-message">
        <h2>Registrazione Completata!</h2>
        <p>Controlla la tua email per attivare l'account.</p>
      </mat-card-content>
    </mat-card>
  }
</div>
