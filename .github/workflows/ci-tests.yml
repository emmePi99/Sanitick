name: Sanitick CI - Automated Testing

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # --- JOB 1: TEST DEL BACKEND (NESTJS) ---
  backend-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Avvia il Database di Test (Postgres)
        env:
          POSTGRES_USER: sanitick_test_user
          POSTGRES_PASSWORD: sanitick_test_password
          POSTGRES_DB: sanitick_test_db
        run: |
          docker compose up -d
          sleep 10 

      - name: Setup di Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json' # Ora funzionerà perché lo tracciamo!

      - name: Installazione dipendenze Backend
        run: |
          cd backend
          npm ci

      - name: Esecuzione Test Sanitick Backend (Unit & E2E)
        env:
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_USERNAME: sanitick_test_user
          DATABASE_PASSWORD: sanitick_test_password
          DATABASE_NAME: sanitick_test_db
          JWT_SECRET: chiave_segreta_finta_per_i_test_di_sanitick_2026
        run: |
          cd backend
          npm run test
          npm run test:e2e

  # --- JOB 2: TEST DEL FRONTEND (ANGULAR) ---
  frontend-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Setup di Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Installazione dipendenze Frontend
        run: |
          cd frontend
          npm ci

      - name: Esecuzione Test Angular (Headless)
        run: |
          cd frontend
          # Gira in modalità headless (senza interfaccia grafica) sul server di GitHub
          npx ng test --watch=false --browsers=ChromeHeadless