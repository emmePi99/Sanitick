<div class="container">
  <mat-card>
    <mat-card-header>
      <mat-card-title>Imposta Password</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <div *ngIf="errorMessage" class="error-message">{{ errorMessage }}</div>
      <div *ngIf="success" class="success-message">Password impostata correttamente! Reindirizzamento al login...</div>
      
      <form [formGroup]="setPasswordForm" (ngSubmit)="onSubmit()" *ngIf="!success">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Nuova Password</mat-label>
          <input matInput formControlName="password" type="password">
        </mat-form-field>
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Conferma Password</mat-label>
          <input matInput formControlName="confirmPassword" type="password">
          <mat-error *ngIf="setPasswordForm.hasError('passwordMismatch')">Le password non coincidono</mat-error>
        </mat-form-field>
        <button mat-raised-button color="primary" type="submit" [disabled]="setPasswordForm.invalid" class="full-width">Salva Password</button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
