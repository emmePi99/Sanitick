name: Sanitick CI - Automated Testing

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    env:
      DB_HOST: localhost
      DB_PORT: 5433
      DB_USER: postgres_test
      DB_PASSWORD: password_test
      DB_NAME: sanitick_test
      DB_LOGGING: 'false'
      JWT_SECRET: chiave_segreta_finta_per_i_test_di_sanitick_2026

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Avvia il Database di Test (Postgres)
        run: |
          docker compose -f docker-compose.test.yml up -d
          # Attendi che Postgres sia pronto ad accettare connessioni
          echo "In attesa che il database Postgres sia pronto..."
          until docker compose -f docker-compose.test.yml exec -T db_test pg_isready -U $DB_USER -d $DB_NAME; do
            sleep 2
          done
          echo "Database pronto!"

      - name: Setup di Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: "./backend/package-lock.json"

      - name: Installazione dipendenze Backend
        run: |
          cd backend
          npm ci

      - name: Genera .env.test
        run: |
          cd backend
          echo "DB_HOST=$DB_HOST" > .env.test
          echo "DB_PORT=$DB_PORT" >> .env.test
          echo "DB_USER=$DB_USER" >> .env.test
          echo "DB_PASSWORD=$DB_PASSWORD" >> .env.test
          echo "DB_NAME=$DB_NAME" >> .env.test
          echo "DB_LOGGING=$DB_LOGGING" >> .env.test
          echo "NODE_ENV=test" >> .env.test

      - name: Esecuzione Test Sanitick Backend (Unit & E2E)
        run: |
          cd backend
          npm run test
          npm run test:e2e --ignore-scripts

  frontend-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Setup di Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: "./frontend/package-lock.json"

      - name: Installazione dipendenze Frontend
        run: |
          cd frontend
          npm ci

      - name: Esecuzione Test Angular (Vitest)
        run: |
          cd frontend
          npm run test -- --watch=false
